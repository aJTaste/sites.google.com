<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AppHub">
    <title>404 | AppHub</title>
    <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/skeleton.css">
    <link rel="icon" href="assets/favicon1.svg">
    <link rel="apple-touch-icon" href="assets/icon1.svg">
    <style>
      .error-container{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        text-align:center;
        padding:24px;
      }
      .error-code{
        font-size:120px;
        font-weight:700;
        color:var(--main);
        line-height:1;
        margin-bottom:16px;
      }
      .error-message{
        font-size:24px;
        color:var(--text-primary);
        margin-bottom:32px;
      }
      .error-links{
        display:flex;
        gap:16px;
      }
    </style>
  </head>
  <body class="page-loading">
    <div class="error-container">
      <div class="error-code">404</div>
      <div class="error-message">404とは 404エラーを表す。このURLが存在していないことを示している。</div>
      <div class="error-links">
        <a href="hub.html" class="btn-primary">ハブに戻る</a>
        <a href="login.html" class="btn-secondary">ログイン</a>
      </div>
    </div>
    <script src="js/pwa.js"></script>
</body>
</html>
