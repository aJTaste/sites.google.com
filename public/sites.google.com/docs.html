<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AppHub">
  <title>Docs | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/docs.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="icon" href="/sites.google.com/assets/favicon.svg">
<link rel="icon" href="/sites.google.com/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/sites.google.com/assets/apple-touch-icon.png">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content">
        <div class="docs-container">
          <div class="docs-header">
            <h1>Docs</h1>
            <div class="docs-status">
              <span class="status-text" id="status-text"></span>
              <span class="last-updated" id="last-updated"></span>
            </div>
          </div>
          <div class="docs-editor">
            <textarea id="note-textarea" placeholder=""></textarea>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script type="module" src="js/docs.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
<script src="common/eruda-init.js"></script> 
  <script src="js/pwa.js"></script>
</body>
</html>
