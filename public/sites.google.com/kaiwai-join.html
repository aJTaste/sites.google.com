<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AppHub">
  <title>界隈に参加する | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/kaiwai-join.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="icon" href="/sites.google.com/assets/favicon.svg">
<link rel="icon" href="/sites.google.com/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/sites.google.com/assets/apple-touch-icon.png">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content">
        <div class="join-wrap">

          <!-- 招待コード入力フォーム -->
          <div class="join-card" id="state-form">
            <div class="join-card-head">
              <div class="join-icon">
                <span class="material-symbols-outlined">login</span>
              </div>
              <h2>界隈に参加する</h2>
              <p>招待コードを入力して、既存の界隈に参加します。</p>
            </div>
            <div class="join-card-body">
              <div class="field-group">
                <label class="field-label">招待コード <span class="req">*</span></label>
                <input type="text" id="inp-code" maxlength="16" placeholder="例: gamer2025" autocomplete="off" spellcheck="false">
                <span class="error-message" id="err-code"></span>
              </div>
              <button class="btn-primary join-submit-btn" id="join-btn">参加する</button>
              <span class="error-message" id="err-submit"></span>
            </div>
          </div>

          <!-- すでに参加済み -->
          <div class="join-card status-card" id="state-already" hidden>
            <span class="material-symbols-outlined s-icon s-already">info</span>
            <h2>すでに参加済みです</h2>
            <p class="s-name" id="already-name"></p>
            <p class="s-desc">この界隈にはすでに参加しています。</p>
            <a href="chat.html" class="btn-primary" style="display:inline-block;margin-top:20px;text-decoration:none;">チャットを開く</a>
          </div>

          <!-- 参加成功 -->
          <div class="join-card status-card" id="state-success" hidden>
            <span class="material-symbols-outlined s-icon s-success">check_circle</span>
            <h2>参加しました！</h2>
            <p class="s-name" id="success-name"></p>
            <p class="s-desc">チャットへ移動します...</p>
          </div>

        </div>
      </main>
    </div>
  </div>
  <script type="module" src="js/kaiwai-join.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
  <script src="common/eruda-init.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
