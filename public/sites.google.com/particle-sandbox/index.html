<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>粒子シミュレータ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>粒子シミュレータ</h1>
      <p>すべては粒子から始まる</p>
    </div>

    <div class="main">
      <div class="canvas-wrapper">
        <canvas id="canvas" width="600" height="600"></canvas>
        <div class="grid-info">8×8配置グリッド / 自由移動</div>
        <div class="mode-info" id="modeInfo">モード: 粒子配置</div>
      </div>

      <div class="panel">
        <div class="section">
          <h3>フォルダ設定</h3>
          <button id="selectFolderBtn">フォルダを選択</button>
          <div class="folder-status" id="folderStatus">未設定</div>
        </div>

        <div class="section">
          <h3>オブジェクト</h3>
          <label>
            名前: <input type="text" id="objectName" placeholder="object1">
          </label>
          <button id="saveObjectBtn" disabled>オブジェクト保存</button>
          <div class="object-list" id="objectList">
            <div class="empty-msg">フォルダを選択してください</div>
          </div>
        </div>

        <div class="section">
          <h3>制御</h3>
          <button id="playBtn">再生</button>
          <button id="pauseBtn">停止</button>
          <button id="clearBtn">消去</button>
        </div>

        <div class="section">
          <h3>粒子設定</h3>
          <label>
            質量: <input type="range" id="massSlider" min="1" max="10" value="5">
            <span id="massValue">5</span>
          </label>
          <label>
            反発力: <input type="range" id="repelSlider" min="0" max="100" value="50">
            <span id="repelValue">50</span>
          </label>
        </div>

        <div class="section">
          <h3>物理設定</h3>
          <label>
            <input type="checkbox" id="gravityCheck" checked>
            重力
          </label>
          <label>
            <input type="checkbox" id="dampingCheck" checked>
            減衰
          </label>
          <label>
            <input type="checkbox" id="collisionCheck" checked>
            粒子衝突
          </label>
        </div>

        <div class="section">
          <h3>情報</h3>
          <div class="info">粒子数: <span id="particleCount">0</span></div>
          <div class="info">Tick: <span id="tickCount">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
