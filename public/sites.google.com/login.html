<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AppHub">
  <title>Sign In | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/skeleton.css">
  <link rel="stylesheet" href="css/auth.css">  
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="auth-container">
    <header class="auth-header">
      <div class="header-left">
        <img src="assets/favicon1.svg" alt="AppHub" class="logo-icon">
        <a href="index.html" style="text-decoration:none;color:inherit;">
          <h1 class="logo-text" style="cursor:pointer;">AppHub</h1>
        </a>
        <span class="header-divider">|</span>
        <span class="page-title">ログイン</span>
      </div>
    </header>
    <main class="auth-main">
      <div class="auth-box">
        <form id="login-form">
          <div class="input-group">
            <label for="user-id">ID</label>
            <input type="text" id="user-id" placeholder="例: 1000" required>
          </div>
          <div class="input-group">
            <label for="password">パスワード</label>
            <input type="password" id="password" placeholder="パスワードを入力" required>
            <span class="error-message" id="login-error"></span>
          </div>
          <button type="submit" class="btn-primary btn-full" id="submit-btn">ログイン</button>
        </form>
        <div class="auth-footer">
          アカウントをお持ちでないですか？ <a href="register.html">新規登録</a>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="js/login.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
