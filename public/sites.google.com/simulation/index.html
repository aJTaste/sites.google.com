<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白黒物理サンドボックス</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #000;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none; /* UIの下をクリックできるように */
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .controls {
            font-size: 12px;
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border: 2px solid #000;
        }

        .key {
            display: inline-block;
            border: 1px solid #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-right: 4px;
            font-family: monospace;
        }

        .status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-family: monospace;
            font-size: 14px;
            text-align: right;
        }

        #mode-indicator {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 5px;
            border-bottom: 2px solid #000;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>PHYSICS SANDBOX</h1>
        <div class="controls">
            <div><span class="key">左クリック + ドラッグ</span> 線を描く / 物体を動かす</div>
            <div><span class="key">右クリック + ドラッグ</span> 線を切る / 点を消す</div>
            <div><span class="key">1</span> ペンモード (描画)</div>
            <div><span class="key">2</span> ドラッグモード (移動)</div>
            <div><span class="key">3</span> ピン留めモード (固定)</div>
            <div><span class="key">4</span> 引き裂きモード (切断)</div>
            <div><span class="key">SPACE</span> 重力 ON/OFF</div>
            <div><span class="key">C</span> 全消去 (Clear)</div>
            <div style="margin-top:8px; font-size:10px; opacity:0.7;">
                ヒント: 三角形を作ると硬くなります。<br>
                四角形はぐにゃぐにゃします。
            </div>
        </div>
    </div>

    <div class="status">
        <div id="mode-indicator">MODE: PEN</div>
        <div id="entity-count">Points: 0 | Sticks: 0</div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        // --- 設定 ---
        const CONFIG = {
            gravity: 0.5,
            friction: 0.99,
            groundFriction: 0.9,
            bounce: 0.9,
            stiffness: 1, // 棒の硬さ (反復回数で調整)
            physicsIterations: 5, // 高いほど硬く、重くなる
            snapDistance: 15 // 点を繋げる距離
        };

        // --- ベクトル計算クラス ---
        class Vector {
            constructor(x, y) { this.x = x; this.y = y; }
            add(v) { return new Vector(this.x + v.x, this.y + v.y); }
            sub(v) { return new Vector(this.x - v.x, this.y - v.y); }
            mult(n) { return new Vector(this.x * n, this.y * n); }
            dist(v) { return Math.sqrt((this.x - v.x) ** 2 + (this.y - v.y) ** 2); }
        }

        // --- 物理オブジェクト: 点 (Point) ---
        class Point {
            constructor(x, y, pinned = false) {
                this.x = x;
                this.y = y;
                this.oldx = x; // 過去の位置（速度計算用）
                this.oldy = y;
                this.pinned = pinned;
            }

            update() {
                if (this.pinned) return;

                const vx = (this.x - this.oldx) * CONFIG.friction;
                const vy = (this.y - this.oldy) * CONFIG.friction;

                this.oldx = this.x;
                this.oldy = this.y;

                this.x += vx;
                this.y += vy;
                this.y += CONFIG.gravity;
            }

            constrain() {
                if (this.pinned) return;

                const width = canvas.width;
                const height = canvas.height;
                const radius = 2; // 点の半径

                // 壁と床の衝突
                if (this.x > width - radius) {
                    this.x = width - radius;
                    this.oldx = this.x + (this.x - this.oldx) * CONFIG.bounce;
                } else if (this.x < radius) {
                    this.x = radius;
                    this.oldx = this.x + (this.x - this.oldx) * CONFIG.bounce;
                }

                if (this.y > height - radius) {
                    this.y = height - radius;
                    // 地面の摩擦
                    const vx = (this.x - this.oldx) * CONFIG.groundFriction;
                    this.oldx = this.x - vx;
                    this.oldy = this.y + (this.y - this.oldy) * CONFIG.bounce; // 跳ね返り計算修正
                } else if (this.y < radius) {
                    this.y = radius;
                    this.oldy = this.y + (this.y - this.oldy) * CONFIG.bounce;
                }
            }
        }

        // --- 物理オブジェクト: 棒 (Stick/Constraint) ---
        class Stick {
            constructor(p1, p2) {
                this.p1 = p1;
                this.p2 = p2;
                this.length = new Vector(p1.x, p1.y).dist(new Vector(p2.x, p2.y));
                this.color = '#000';
            }

            update() {
                const dx = this.p2.x - this.p1.x;
                const dy = this.p2.y - this.p1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist === 0) return;

                const diff = this.length - dist;
                const percent = (diff / dist) / 2;
                
                const offsetX = dx * percent;
                const offsetY = dy * percent;

                if (!this.p1.pinned) {
                    this.p1.x -= offsetX;
                    this.p1.y -= offsetY;
                }
                if (!this.p2.pinned) {
                    this.p2.x += offsetX;
                    this.p2.y += offsetY;
                }
            }

            render(ctx) {
                ctx.beginPath();
                ctx.moveTo(this.p1.x, this.p1.y);
                ctx.lineTo(this.p2.x, this.p2.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }

        // --- ゲームエンジン ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let points = [];
        let sticks = [];
        let width = window.innerWidth;
        let height = window.innerHeight;

        // 状態管理
        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let mode = 'PEN'; // PEN, DRAG, PIN, CUT
        let activePoint = null; // ドラッグ中の点
        let hoverPoint = null; // マウスの下にある点
        let drawingStartPoint = null; // 線を描くときの始点

        // 初期化
        function init() {
            resize();
            window.addEventListener('resize', resize);
            loop();
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        // メインループ
        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        function update() {
            // 物理演算の更新
            for (let p of points) p.update();

            // 制約の解決（反復することで硬さを出す）
            for (let i = 0; i < CONFIG.physicsIterations; i++) {
                for (let s of sticks) s.update();
                for (let p of points) p.constrain();
                
                // ドラッグ中の処理 (物理演算に割り込む)
                if (mode === 'DRAG' && isMouseDown && activePoint) {
                    activePoint.x = mouseX;
                    activePoint.y = mouseY;
                    activePoint.oldx = mouseX; // 速度リセット
                    activePoint.oldy = mouseY;
                }
            }
            
            // UI更新
            document.getElementById('entity-count').innerText = `Points: ${points.length} | Sticks: ${sticks.length}`;
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            // 棒の描画
            for (let s of sticks) s.render(ctx);

            // 点の描画 (黒い丸)
            ctx.fillStyle = '#000';
            for (let p of points) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.pinned ? 4 : 2, 0, Math.PI * 2);
                ctx.fill();
                
                // ピン留めされている点はバツ印装飾
                if (p.pinned) {
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(p.x - 2, p.y - 2);
                    ctx.lineTo(p.x + 2, p.y + 2);
                    ctx.moveTo(p.x + 2, p.y - 2);
                    ctx.lineTo(p.x - 2, p.y + 2);
                    ctx.stroke();
                }
            }

            // インタラクションの描画
            if (mode === 'PEN' && isMouseDown && drawingStartPoint) {
                ctx.beginPath();
                ctx.moveTo(drawingStartPoint.x, drawingStartPoint.y);
                ctx.lineTo(mouseX, mouseY);
                ctx.strokeStyle = '#999';
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // ホバーエフェクト
            if (hoverPoint) {
                ctx.beginPath();
                ctx.arc(hoverPoint.x, hoverPoint.y, 6, 0, Math.PI * 2);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            // 切断軌跡（簡易）
            if (mode === 'CUT' && isMouseDown) {
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 5, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,0,0,0.5)'; // 切断モードだけ少し色味をつけるか、白黒維持ならグレー
                ctx.fill();
            }
        }

        // --- ツール関数 ---

        function getClosestPoint(x, y, radius = 20) {
            let closest = null;
            let minDist = radius;
            for (let p of points) {
                const d = Math.sqrt((p.x - x) ** 2 + (p.y - y) ** 2);
                if (d < minDist) {
                    minDist = d;
                    closest = p;
                }
            }
            return closest;
        }

        function removePoint(point) {
            points = points.filter(p => p !== point);
            sticks = sticks.filter(s => s.p1 !== point && s.p2 !== point);
        }
        
        function cutSticksAt(x, y) {
            const cutRadius = 10;
            sticks = sticks.filter(s => {
                // 点と線分の距離計算
                const A = x - s.p1.x;
                const B = y - s.p1.y;
                const C = s.p2.x - s.p1.x;
                const D = s.p2.y - s.p1.y;

                const dot = A * C + B * D;
                const len_sq = C * C + D * D;
                let param = -1;
                if (len_sq != 0) param = dot / len_sq;

                let xx, yy;

                if (param < 0) {
                    xx = s.p1.x; yy = s.p1.y;
                } else if (param > 1) {
                    xx = s.p2.x; yy = s.p2.y;
                } else {
                    xx = s.p1.x + param * C;
                    yy = s.p1.y + param * D;
                }

                const dx = x - xx;
                const dy = y - yy;
                return (dx * dx + dy * dy) > cutRadius * cutRadius; 
            });
        }

        // --- 入力イベント ---

        canvas.addEventListener('mousedown', e => {
            isMouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // 右クリック処理
            if (e.button === 2) {
                e.preventDefault();
                const p = getClosestPoint(mouseX, mouseY);
                if (p) removePoint(p);
                return;
            }

            const existingPoint = getClosestPoint(mouseX, mouseY, CONFIG.snapDistance);

            if (mode === 'PEN') {
                if (existingPoint) {
                    drawingStartPoint = existingPoint;
                } else {
                    const p = new Point(mouseX, mouseY);
                    points.push(p);
                    drawingStartPoint = p;
                }
            } else if (mode === 'DRAG') {
                activePoint = existingPoint;
            } else if (mode === 'PIN') {
                if (existingPoint) {
                    existingPoint.pinned = !existingPoint.pinned;
                    // 速度を殺して安定させる
                    existingPoint.oldx = existingPoint.x;
                    existingPoint.oldy = existingPoint.y;
                }
            } else if (mode === 'CUT') {
                cutSticksAt(mouseX, mouseY);
            }
        });

        canvas.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            hoverPoint = getClosestPoint(mouseX, mouseY, CONFIG.snapDistance);

            if (!isMouseDown) return;

            if (mode === 'PEN') {
                // ドラッグ描画中には何もしない（mouseupで確定）
            } else if (mode === 'CUT') {
                cutSticksAt(mouseX, mouseY);
            }
        });

        canvas.addEventListener('mouseup', e => {
            if (e.button === 2) { isMouseDown = false; return; }

            if (mode === 'PEN' && drawingStartPoint) {
                const endPoint = getClosestPoint(mouseX, mouseY, CONFIG.snapDistance);
                
                let targetPoint;
                if (endPoint) {
                    targetPoint = endPoint;
                } else {
                    targetPoint = new Point(mouseX, mouseY);
                    points.push(targetPoint);
                }

                // 自分自身への接続を防ぐ
                if (drawingStartPoint !== targetPoint) {
                    // 重複接続を防ぐ
                    const exists = sticks.some(s => 
                        (s.p1 === drawingStartPoint && s.p2 === targetPoint) ||
                        (s.p1 === targetPoint && s.p2 === drawingStartPoint)
                    );
                    if (!exists) {
                        sticks.push(new Stick(drawingStartPoint, targetPoint));
                    }
                }
                
                // 連続描画のために終点を始点にする（連続線の作成が楽になる）
                // drawingStartPoint = targetPoint; // コメントアウトを外すと連続描画モード
                drawingStartPoint = null;
            }

            isMouseDown = false;
            activePoint = null;
            drawingStartPoint = null;
        });
        
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // キーボードショートカット
        window.addEventListener('keydown', e => {
            const map = {
                '1': 'PEN',
                '2': 'DRAG',
                '3': 'PIN',
                '4': 'CUT'
            };
            if (map[e.key]) {
                mode = map[e.key];
                document.getElementById('mode-indicator').innerText = `MODE: ${mode}`;
            }

            if (e.code === 'Space') {
                CONFIG.gravity = CONFIG.gravity === 0 ? 0.5 : 0;
            }
            if (e.code === 'KeyC') {
                points = [];
                sticks = [];
            }
        });

        // スタート
        init();
        
        // --- 初期デモオブジェクト作成 ---
        function createBox(x, y, size) {
            let p1 = new Point(x, y);
            let p2 = new Point(x + size, y);
            let p3 = new Point(x + size, y + size);
            let p4 = new Point(x, y + size);
            points.push(p1, p2, p3, p4);
            sticks.push(new Stick(p1, p2));
            sticks.push(new Stick(p2, p3));
            sticks.push(new Stick(p3, p4));
            sticks.push(new Stick(p4, p1));
            // 筋交い（形を保つため）
            sticks.push(new Stick(p1, p3)); 
        }

        function createRope(x, y, segments) {
            let prev = new Point(x, y, true); // 始点は固定
            points.push(prev);
            for(let i=1; i<segments; i++) {
                let p = new Point(x + i*20, y);
                points.push(p);
                sticks.push(new Stick(prev, p));
                prev = p;
            }
        }

        // デモ用オブジェクト
        createBox(300, 100, 50);
        createBox(360, 200, 80);
        createRope(500, 50, 10);

    </script>
</body>
</html>
