<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Logic & Physics Sandbox 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
    <canvas id="simCanvas"></canvas>
    
    <div id="top-bar">
      <button id="btn-pause">一時停止 (Pause)</button>
      <button id="btn-step">コマ送り (Step)</button>
      <span class="separator">|</span>
      <button id="btn-save">保存 (Save)</button>
      <button id="btn-load">開く (Load)</button>
      <span class="separator">|</span>
      <button id="btn-fill" title="ショートカット: F">塗りつぶし (Fill)</button>
      <button id="btn-clear">全消去</button>
      <span id="status-msg">Ready</span>
    </div>

    <div id="bottom-bar">
      <div id="tools-scroll">
        <div id="tools"></div>
      </div>
      <div id="controls-info">
        <small>
          2本指スクロール: Zoom | Alt+ドラッグ: Pan | Space: Play/Pause<br>
          左クリック: Place/Select | 2本指タップ: Del<br>
          Ctrl+C/V: Copy/Paste
        </small>
      </div>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
