<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Ultraviolet | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/uv.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content" style="padding:0;">
        <div class="uv-container">
          <!-- 検索バー -->
          <div class="uv-controls">
            <button class="control-btn" id="home-btn" title="ホーム">
              <span class="material-symbols-outlined">home</span>
            </button>
            
            <div class="url-bar">
              <span class="lock-icon material-symbols-outlined">lock</span>
              <input type="text" id="url-input" placeholder="URLを入力してください" autocomplete="off">
              <button class="go-btn" id="go-btn">
                <span class="material-symbols-outlined">arrow_forward</span>
              </button>
            </div>
            
            <button class="control-btn" id="reload-btn" title="再読み込み">
              <span class="material-symbols-outlined">refresh</span>
            </button>
            
            <button class="control-btn" id="fullscreen-btn" title="全画面">
              <span class="material-symbols-outlined">fullscreen</span>
            </button>
          </div>
          
          <!-- ステータス -->
          <div class="uv-status" id="uv-status">
            <span class="material-symbols-outlined">info</span>
            <span id="status-text">Service Worker登録中...</span>
          </div>
          
          <!-- コンテンツエリア -->
          <div class="uv-content" id="uv-content">
            <div class="welcome-screen">
              <div class="welcome-icon">
                <span class="material-symbols-outlined">shield</span>
              </div>
              <h2>Ultraviolet Proxy</h2>
              <p>高性能なWebプロキシでブロックを回避</p>
              <div class="info-box">
                <h3>使い方</h3>
                <ol>
                  <li>Service Workerの登録が完了するまで待つ</li>
                  <li>URLバーにアクセスしたいURLを入力</li>
                  <li>全画面ボタンで最大化できます</li>
                </ol>
              </div>
              <div class="feature-list">
                <div class="feature-item">
                  <span class="material-symbols-outlined">verified_user</span>
                  <span>安全なプロキシ接続</span>
                </div>
                <div class="feature-item">
                  <span class="material-symbols-outlined">speed</span>
                  <span>高速レスポンス</span>
                </div>
                <div class="feature-item">
                  <span class="material-symbols-outlined">code</span>
                  <span>JavaScriptフル対応</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  
  <!-- Eruda（デバッグコンソール） -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  
  <!-- Ultravioletコア -->
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@3/dist/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  
  <!-- 初期化スクリプト -->
  <script type="module" src="js/uv.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
</body>
</html>
