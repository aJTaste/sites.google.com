<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>aJTGate | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/gate.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content" style="padding:0;">
        <div class="gate-container">
          
          <!-- 左サイドバー: ナビゲーション -->
          <aside class="gate-sidebar">
            <nav class="gate-nav">
              <button class="gate-nav-btn active" data-view="home">
                <span class="material-symbols-outlined">home</span>
                <span>ホーム</span>
              </button>
              <button class="gate-nav-btn" data-view="explore">
                <span class="material-symbols-outlined">explore</span>
                <span>見つける</span>
              </button>
              <button class="gate-nav-btn" data-view="notifications">
                <span class="material-symbols-outlined">notifications</span>
                <span>通知</span>
                <span class="nav-badge" id="notif-badge" style="display:none;">0</span>
              </button>
              <button class="gate-nav-btn" data-view="profile">
                <span class="material-symbols-outlined">person</span>
                <span>プロフィール</span>
              </button>
            </nav>
            
            <button class="gate-post-btn" id="new-post-btn">
              <span class="material-symbols-outlined">edit</span>
              <span>投稿</span>
            </button>
          </aside>
          
          <!-- 中央: メインコンテンツ -->
          <main class="gate-main">
            <!-- タブ切り替え -->
            <div class="gate-tabs">
              <button class="gate-tab active" data-feed="all">おすすめ</button>
              <button class="gate-tab" data-feed="following">フォロー中</button>
            </div>
            
            <!-- タイムライン -->
            <div class="gate-timeline" id="timeline">
              <div class="timeline-loading">
                <div class="loading-spinner"></div>
                <p>読み込み中...</p>
              </div>
            </div>
          </main>
          
          <!-- 右サイドバー: トレンド・おすすめ -->
          <aside class="gate-right-sidebar">
            <div class="search-box">
              <span class="material-symbols-outlined">search</span>
              <input type="text" placeholder="検索" id="search-input">
            </div>
            
            <div class="widget">
              <h3>おすすめユーザー</h3>
              <div id="suggested-users">
                <!-- JSで生成 -->
              </div>
            </div>
          </aside>
          
        </div>
      </main>
    </div>
  </div>
  
  <!-- 投稿モーダル -->
  <div class="gate-modal" id="post-modal">
    <div class="gate-modal-content">
      <div class="gate-modal-header">
        <h3>新規投稿</h3>
        <button class="gate-modal-close" id="post-modal-close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="gate-modal-body">
        <textarea id="post-text" placeholder="いま何してる？" maxlength="280"></textarea>
        <div class="post-media-preview" id="post-media-preview"></div>
        <div class="post-actions">
          <input type="file" id="media-input" accept="image/*,video/*" multiple hidden>
          <button class="post-action-btn" id="add-media-btn">
            <span class="material-symbols-outlined">image</span>
          </button>
          <div class="char-count" id="char-count">280</div>
        </div>
      </div>
      <div class="gate-modal-footer">
        <button class="btn-secondary" id="post-cancel">キャンセル</button>
        <button class="btn-primary" id="post-submit">投稿</button>
      </div>
    </div>
  </div>
  
  <!-- 詳細モーダル -->
  <div class="gate-modal" id="detail-modal">
    <div class="gate-modal-content detail-modal-content">
      <div class="gate-modal-header">
        <button class="gate-modal-close" id="detail-modal-close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="gate-modal-body" id="detail-modal-body">
        <!-- JSで生成 -->
      </div>
    </div>
  </div>
  
  <script type="module" src="js/gate.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
<script src="common/eruda-init.js"></script> 
</body>
</html>
