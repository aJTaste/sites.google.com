<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Database | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/db.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content">
        <div class="db-container">
          <div class="db-header">
            <h1>Database - profiles</h1>
            <div class="db-controls">
              <div class="total-count">
                全 <strong id="total-count">0</strong> 件
              </div>
              <button class="refresh-btn" id="refresh-btn">
                <span class="material-symbols-outlined">refresh</span>
                <span>更新</span>
              </button>
            </div>
          </div>

          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>id</th>
                  <th>user_id</th>
                  <th>display_name</th>
                  <th>last_name</th>
                  <th>first_name</th>
                  <th>role</th>
                  <th>is_online</th>
                  <th>last_online</th>
                  <th>avatar_url</th>
                  <th>avatar_color</th>
                  <th>created_at</th>
                  <th>updated_at</th>
                </tr>
              </thead>
              <tbody id="data-tbody">
                <tr>
                  <td colspan="20" style="text-align:center;padding:40px;color:var(--text-tertiary);">
                    読み込み中...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/db.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
</body>
</html>
