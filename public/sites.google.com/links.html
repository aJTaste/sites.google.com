<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Links | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/links.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content">
        <div class="links-container">
          <div class="links-header">
            <h1>Links</h1>
            <p class="links-description">ゲームや便利ツールのURLを共有できます</p>
          </div>

          <div class="add-link-section">
            <h2>リンクを追加</h2>
            <form class="add-link-form" id="add-link-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="link-url">URL</label>
                  <input type="url" id="link-url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                  <label for="link-category">カテゴリー</label>
                  <select id="link-category" required>
                    <option value="game">ゲーム</option>
                    <option value="other">その他</option>
                  </select>
                </div>
              </div>
              <div class="form-group">
                <label for="link-description">説明</label>
                <input type="text" id="link-description" placeholder="このリンクの説明を入力" required>
              </div>
              <button type="submit" class="btn-primary">投稿</button>
              <span class="error-message" id="link-error"></span>
            </form>
          </div>

          <div class="filter-section">
            <button class="filter-btn active" data-filter="all">
              <span class="material-symbols-outlined">apps</span>
              <span>すべて</span>
            </button>
            <button class="filter-btn" data-filter="game">
              <span class="material-symbols-outlined">sports_esports</span>
              <span>ゲーム</span>
            </button>
            <button class="filter-btn" data-filter="other">
              <span class="material-symbols-outlined">category</span>
              <span>その他</span>
            </button>
          </div>

          <div class="links-grid" id="links-grid">
            <div class="empty-state">
              <span class="material-symbols-outlined">link</span>
              <p>読み込み中...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/links.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
</body>
</html>
