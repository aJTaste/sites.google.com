<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Games | AppHub</title>
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="css/games.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="assets/favicon1.svg">
  <link rel="apple-touch-icon" href="assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content">
        <div class="games-wrapper">

          <!-- ヘッダーエリア -->
          <div class="games-header">
            <div class="games-header-left">
              <h1 class="games-title">
                <span class="material-symbols-outlined">stadia_controller</span>
                Games
              </h1>
              <span class="games-count" id="games-count"></span>
            </div>
            <div class="games-search-wrap">
              <span class="material-symbols-outlined search-icon">search</span>
              <input
                type="text"
                id="games-search"
                class="games-search"
                placeholder="ゲームを検索..."
                autocomplete="off"
              >
            </div>
          </div>

          <!-- カテゴリフィルター -->
          <div class="games-filters" id="games-filters">
            <!-- JS で生成 -->
          </div>

          <!-- ゲームグリッド -->
          <div class="games-grid" id="games-grid">
            <!-- JS で生成 -->
          </div>

          <!-- 空状態 -->
          <div class="games-empty" id="games-empty" style="display:none;">
            <span class="material-symbols-outlined">search_off</span>
            <p>「<span id="empty-query"></span>」に一致するゲームが見つかりません</p>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/games.js"></script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
  <script src="common/eruda-init.js"></script>
</body>
</html>
