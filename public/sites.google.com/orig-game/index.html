<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VoxelForge - Infinite Block World</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="crosshair">
            <svg width="24" height="24" viewBox="0 0 24 24">
                <line x1="12" y1="4" x2="12" y2="20" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="rgba(255,255,255,0.8)" stroke-width="2"/>
            </svg>
        </div>

        <div id="hotbar">
            <div class="slot active"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>

        <div id="debug-info">
            <p>VoxelForge v0.1.0</p>
            <p id="pos-display">XYZ: 0.000 / 0.000 / 0.000</p>
            <p id="chunk-display">Chunk: 0, 0</p>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
