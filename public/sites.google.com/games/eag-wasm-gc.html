<!DOCTYPE html>
<html style="width:100%;height:100%;background:#000;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0">
  <title>Eaglercraft 1.12 WASM-GC | AppHub</title>
  <link rel="icon" href="../assets/favicon1.svg">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      width:100%;height:100%;overflow:hidden;
      background:#111;font-family:'Segoe UI',sans-serif;
    }
    #game_frame{width:100%;height:100%;}
    #loading-overlay{
      position:fixed;inset:0;
      background:#111;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:20px;z-index:9999;

    }
    #loading-overlay.hidden{
      opacity:0;pointer-events:none;
    }
    .loading-logo{
      font-size:28px;font-weight:700;color:#fff;
      letter-spacing:1px;
    }
    .loading-logo span{color:#4ade80;}
    .loading-bar-wrap{
      width:260px;height:6px;
      background:#333;border-radius:99px;overflow:hidden;
    }
    .loading-bar{
      height:100%;width:0%;
      background:linear-gradient(90deg,#4ade80,#22d3ee);
      border-radius:99px;
      transition:width .3s ease;
    }
    .loading-status{
      font-size:13px;color:#888;
    }
    #error-overlay{
      position:fixed;inset:0;
      background:#111;
      display:none;flex-direction:column;
      align-items:center;justify-content:center;
      gap:16px;z-index:9999;
    }
    #error-overlay.show{display:flex;}
    .error-icon{font-size:48px;}
    .error-title{font-size:22px;font-weight:700;color:#f87171;}
    .error-msg{font-size:14px;color:#888;max-width:320px;text-align:center;line-height:1.6;}
    .error-btn{
      margin-top:8px;padding:10px 28px;
      background:#4ade80;color:#111;
      border:none;border-radius:8px;
      font-size:14px;font-weight:600;cursor:pointer;
    }
    .error-btn:hover{background:#22d3ee;}
  </style>
  <script>
    "use strict";
    window.eaglercraftXOpts={
      container:"game_frame",
      worldsDB:"worlds"
    };
  </script>
  <script>
    "use strict";if(typeof window!=="undefined")window.eaglercraftXClientScriptElement=document.currentScript;(function(){window.main=async function(){let o=window.eaglercraftXOpts;if(!o||typeof o.container!=="string")return;let c=o.assetsURI;if(typeof c!=="string")c=c?.[0]?.url;if(typeof c!=="string")return;let r=document.getElementById(o.container);if(!r)return;r.textContent="";let d=document.createElement("div");d.style.cssText="width:100%;height:100%;background:#000";r.appendChild(d);let b;try{b=c.startsWith("data:")?await(await fetch(c)).arrayBuffer():await(await fetch(c,{cache:"force-cache"})).arrayBuffer()}catch(e){return}let v=new DataView(b);if(v.getUint32(0,!0)!==608649541||v.getUint32(4,!0)!==1297301847)return;let js=new Uint8Array(b,v.getUint32(164,!0),v.getUint32(168,!0));let wasm=new Uint8Array(b,v.getUint32(180,!0),v.getUint32(184,!0));let jsURL=URL.createObjectURL(new Blob([js],{type:"text/javascript"}));let wasmURL=URL.createObjectURL(new Blob([wasm],{type:"application/wasm"}));let opts={};for(let k in o)if(k!=="container"&&k!=="assetsURI")opts[k]=o[k];window.__eaglercraftXLoaderContextPre={rootElement:r,eaglercraftXOpts:opts,theEPWFileBuffer:b,loaderWASMURL:wasmURL,splashURL:null};let s=document.createElement("script");s.src=jsURL;document.head.appendChild(s)}})()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    "use strict";
    eruda.init();

    // ── Eruda とゲームのキーボード競合を解消 ──────────────────────────
    // Eaglercraftはwindow/documentにキーイベントをグローバル登録するため、
    // キャプチャフェーズで先にイベントを横取りし、Erudaがアクティブな時は
    // ゲーム側へ伝播しないようにする。
    (function(){
      let erudaEl=null;
      let erudaActive=false;

      // eruda要素はinit()直後に生成されるが念のたびにポーリング
      function findEruda(){
        erudaEl=document.getElementById("eruda");
        return !!erudaEl;
      }

      function setup(){
        if(!findEruda()){
          setTimeout(setup,200);
          return;
        }

        // Eruda内クリック → アクティブ
        erudaEl.addEventListener("mousedown",function(){
          erudaActive=true;
        },true);
        erudaEl.addEventListener("focusin",function(){
          erudaActive=true;
        },true);

        // Eruda外クリック → ゲームに戻す
        document.addEventListener("mousedown",function(e){
          if(erudaEl&&!erudaEl.contains(e.target)){
            erudaActive=false;
          }
        },true);

        // iキーでErudaをトグル（ゲーム中でも有効）
        // ただし input/textarea/contenteditable への入力中は無視
        let erudaVisible=false;
        function isTyping(){
          const t=document.activeElement;
          if(!t)return false;
          const tag=t.tagName;
          return tag==="INPUT"||tag==="TEXTAREA"||t.isContentEditable;
        }
        window.addEventListener("keydown",function(e){
          if((e.key==="i"||e.key==="I")&&!isTyping()){
            e.stopImmediatePropagation();
            erudaVisible=!erudaVisible;
            if(erudaVisible){
              eruda.show();
              erudaActive=true;
            }else{
              eruda.hide();
              erudaActive=false;
            }
          }
        },true);

        // キーボードイベントをキャプチャフェーズで横取り
        ["keydown","keyup","keypress"].forEach(function(type){
          window.addEventListener(type,function(e){
            // iキー自体はトグル処理に任せる
            if(!erudaActive||e.key==="i"||e.key==="I")return;
            // ゲームのリスナーに届く前に止める
            e.stopImmediatePropagation();
          },true);
        });
      }

      setup();
    })();
    // ─────────────────────────────────────────────────────────────────
  </script>
</head>
<body style="margin:0;width:100%;height:100%;overflow:hidden;background:#000;" id="game_frame">

  <div id="loading-overlay">
    <div class="loading-logo">Eagler<span>craft</span></div>
    <div class="loading-bar-wrap">
      <div class="loading-bar" id="loading-bar"></div>
    </div>
    <div class="loading-status" id="loading-status">データを取得中...</div>
  </div>

  <div id="error-overlay">
    <div class="error-icon">⚠️</div>
    <div class="error-title">読み込み失敗</div>
    <div class="error-msg" id="error-msg">ゲームデータの取得に失敗しました。</div>
    <button class="error-btn" onclick="location.reload()">再読み込み</button>
  </div>

  <script>
    "use strict";
    const bar=document.getElementById("loading-bar");
    const status=document.getElementById("loading-status");
    const overlay=document.getElementById("loading-overlay");
    const errorOverlay=document.getElementById("error-overlay");
    const errorMsg=document.getElementById("error-msg");

    function setProgress(pct,msg){
      bar.style.width=pct+"%";
      status.textContent=msg;
    }

    function showError(msg){
      overlay.classList.add("hidden");
      errorMsg.textContent=msg;
      errorOverlay.classList.add("show");
    }

    function hideLoading(){
      overlay.classList.add("hidden");
    }

    window.addEventListener("load",async function(){
      setProgress(10,"スクリプトを取得中...");
      try{
        const res=await fetch(
          "https://raw.githubusercontent.com/aJTaste/sites.google.com-apphub-data/main/eagler-data.js"
        );
        if(!res.ok)throw new Error("HTTP "+res.status);
        setProgress(60,"スクリプトを解析中...");
        const text=await res.text();
        const s=document.createElement("script");
        s.text=text;
        document.head.appendChild(s);
        if(window.EAGLER_ASSETS_BASE64){
          setProgress(80,"ゲームを起動中...");
          window.eaglercraftXOpts.assetsURI=window.EAGLER_ASSETS_BASE64;
          // ゲーム起動後にローディングを非表示
          setTimeout(hideLoading,1500);
          main();
          setProgress(100,"完了！");
        }else{
          showError("アセットデータが見つかりませんでした。");
        }
      }catch(e){
        showError("データの取得に失敗しました。\n"+e.message);
      }
    });
  </script>
</body>
</html>
