<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proxy | AppHub</title>

  <link rel="stylesheet" href="../common/common.css" />
  <link rel="stylesheet" href="../css/proxy.css" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="icon" href="../assets/favicon1.svg" />
</head>

<body>
  <div class="proxy-container">
    <div class="browser-controls">
      <input id="url-input" placeholder="https://example.com" />
      <button id="go-btn">Go</button>
    </div>

    <div id="browser-content"></div>
  </div>

  <!-- Ultraviolet -->
  <script src="/sites.google.com/uv/uv.bundle.js"></script>
  <script src="/sites.google.com/uv/uv.config.js"></script>

  <script>
    const state = {
      swReady: false,
      currentUrl: ""
    };

    async function registerSW() {
      if (!("serviceWorker" in navigator)) {
        throw new Error("Service Worker 非対応");
      }

      const reg = await navigator.serviceWorker.register(
        "/sites.google.com/uv/uv.sw.js",
        { scope: "/sites.google.com/uv/" }
      );

      if (!navigator.serviceWorker.controller) {
        await new Promise(resolve => {
          navigator.serviceWorker.addEventListener(
            "controllerchange",
            () => resolve(),
            { once: true }
          );
        });
      }

      state.swReady = true;
      console.log("✓ SW ready");
    }

    async function loadUrl(url) {
      if (!url.startsWith("http")) url = "https://" + url;

      if (!state.swReady) {
        await registerSW();
      }

      state.currentUrl = url;

      const encoded = __uv$config.encodeUrl(url);
      const proxyUrl =
        location.origin + __uv$config.prefix + encoded;

      const iframe = document.createElement("iframe");
      iframe.src = proxyUrl;
      iframe.className = "proxy-iframe";
      iframe.allow = "fullscreen";

      const container = document.getElementById("browser-content");
      container.innerHTML = "";
      container.appendChild(iframe);
    }

    document.getElementById("go-btn").onclick = () => {
      loadUrl(document.getElementById("url-input").value);
    };
  </script>
</body>
</html>
