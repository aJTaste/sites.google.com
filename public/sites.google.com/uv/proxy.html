<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proxy | AppHub</title>

  <link rel="stylesheet" href="../common/common.css" />
  <link rel="stylesheet" href="../css/proxy.css" />
</head>

<body>
  <div class="proxy-container">
    <div class="browser-controls">
      <input id="url-input" placeholder="https://example.com" />
      <button id="go-btn">Go</button>
    </div>

    <div id="browser-content"></div>
  </div>

  <script src="/sites.google.com/uv/uv.bundle.js"></script>
  <script src="/sites.google.com/uv/uv.config.js"></script>

  <script>
    const urlInput = document.getElementById("url-input");
    const goBtn = document.getElementById("go-btn");
    const browserContent = document.getElementById("browser-content");

    async function ensureSW() {
      if (!("serviceWorker" in navigator)) {
        alert("Service Worker 非対応");
        return false;
      }

      // すでに制御されていればOK
      if (navigator.serviceWorker.controller) {
        return true;
      }

      // 未登録なら登録
      await navigator.serviceWorker.register(
        "/sites.google.com/uv/uv.sw.js",
        { scope: "/sites.google.com/uv/" }
      );

      // controller が付くまで「強制リロード」
      location.reload();
      return false;
    }

    async function loadUrl(url) {
      if (!url.startsWith("http")) {
        url = "https://" + url;
      }

      const ready = await ensureSW();
      if (!ready) return;

      const encoded = __uv$config.encodeUrl(url);
      const proxyUrl =
        location.origin + __uv$config.prefix + encoded;

      const iframe = document.createElement("iframe");
      iframe.src = proxyUrl;
      iframe.style.width = "100%";
      iframe.style.height = "100%";

      browserContent.innerHTML = "";
      browserContent.appendChild(iframe);
    }

    goBtn.onclick = () => loadUrl(urlInput.value);
  </script>
</body>
</html>
