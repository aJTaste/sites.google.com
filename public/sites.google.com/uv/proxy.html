
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Proxy | AppHub</title>
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="../css/proxy.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="../assets/favicon1.svg">
  <link rel="apple-touch-icon" href="../assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content" style="padding:0;">
        <div class="proxy-container">
          <div class="browser-controls">
            <button class="control-btn" id="home-btn" title="ホーム">
              <span class="material-symbols-outlined">home</span>
            </button>
            
            <div class="url-bar">
              <span class="lock-icon material-symbols-outlined">lock</span>
              <input type="text" id="url-input" placeholder="URLを入力してください（例: https://example.com）" autocomplete="off">
              <button class="go-btn" id="go-btn">
                <span class="material-symbols-outlined">arrow_forward</span>
              </button>
            </div>
            
            <button class="control-btn" id="reload-btn" title="再読み込み">
              <span class="material-symbols-outlined">refresh</span>
            </button>
            
            <button class="control-btn" id="fullscreen-btn" title="全画面">
              <span class="material-symbols-outlined">fullscreen</span>
            </button>
            
            <button class="mode-toggle-btn" id="proxy-mode-btn" title="プロキシモード切替">
              <span class="material-symbols-outlined">swap_horiz</span>
              <span id="current-mode">Ultraviolet</span>
            </button>
          </div>
          
          <div class="browser-content" id="browser-content">
            <div class="welcome-screen">
              <div class="welcome-icon">
                <span class="material-symbols-outlined">public</span>
              </div>
              <h2>プロキシブラウザ</h2>
              <p>フィルタリングを回避してWebサイトにアクセスできます</p>
              <div class="info-box">
                <h3>使い方</h3>
                <ol>
                  <li>上部のURLバーにアクセスしたいURLを入力</li>
                  <li>読み込みに失敗した場合は、右上のモード切替ボタンを押す</li>
                  <li>全画面ボタンで画面を最大化できます</li>
                </ol>
              </div>
              <div class="mode-info">
                <p><strong>現在のモード:</strong> <span class="mode-badge">Ultraviolet</span></p>
                <p class="mode-desc">最新のプロキシ技術で高速・安定動作</p>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/sites.google.com/uv/uv.bundle.js"></script>
  <script src="/sites.google.com/uv/uv.config.js"></script>
  <script type="module">
    import{initPage}from'/sites.google.com/common/core.js';

    // Service Worker登録（UV必須）
    async function registerSW(){
      if('serviceWorker'in navigator){
        try{
          await navigator.serviceWorker.register('/sites.google.com/uv/uv.sw.js',{
            scope:'/sites.google.com/uv/'
          });
          console.log('✓ Service Worker registered');
        }catch(e){
          console.error('✗ SW registration failed:',e);
        }
      }
    }

    // ページ初期化待機
    await initPage('proxy','プロキシブラウザ');

    // SW登録
    await registerSW();

    const state={
      currentUrl:'',
      mode:'ultraviolet'
    };

    const PROXY_SERVICES={
      ultraviolet:{
        name:'Ultraviolet',
        load:async(url)=>{
          const encoded=__uv$config.encodeUrl(url);
          return __uv$config.prefix+encoded+'#youtube.com';
        }
      },
      allorigins:{
        name:'AllOrigins',
        load:async(url)=>{
          return `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}#youtube.com`;
        }
      },
      corsproxy:{
        name:'CORS Proxy',
        load:async(url)=>{
          return `https://corsproxy.io/?${encodeURIComponent(url)}#youtube.com`;
        }
      }
    };

    const urlInput=document.getElementById('url-input');
    const goBtn=document.getElementById('go-btn');
    const reloadBtn=document.getElementById('reload-btn');
    const homeBtn=document.getElementById('home-btn');
    const fullscreenBtn=document.getElementById('fullscreen-btn');
    const proxyModeBtn=document.getElementById('proxy-mode-btn');
    const browserContent=document.getElementById('browser-content');
    const currentModeText=document.getElementById('current-mode');
    const proxyContainer=document.querySelector('.proxy-container');

    const welcomeHTML=document.querySelector('.welcome-screen').outerHTML;

    async function loadUrl(url){
  if(!url)return;
  if(!url.startsWith('http'))url='https://'+url;
  state.currentUrl=url;
  urlInput.value=url;
  showLoading();

  try{
    // ★ 修正3の核心
    await navigator.serviceWorker.ready;

    // ★ まだ制御下に入っていなければ、1回だけリロード
    if(!navigator.serviceWorker.controller){
      location.reload();
      return;
    }

    const encoded=__uv$config.encodeUrl(url);
    const proxyUrl=__uv$config.prefix+encoded+'#youtube.com';

    const iframe=document.createElement('iframe');
    iframe.className='proxy-iframe';
    iframe.src=proxyUrl;
    iframe.sandbox='allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation';


    browserContent.innerHTML='';
    browserContent.appendChild(iframe);
  }catch(e){
    showError(url,e.message);
  }
}



    function showLoading(){
      browserContent.innerHTML=`
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p>読み込み中...</p>
        </div>
      `;
    }

    function showError(url,message){
      browserContent.innerHTML=`
        <div class="error-screen">
          <div class="error-icon">
            <span class="material-symbols-outlined">error</span>
          </div>
          <h2>読み込みに失敗しました</h2>
          <p>${message}</p>
          <p style="font-size:14px;color:var(--text-tertiary);margin-bottom:24px;">URL: ${url}</p>
          <div class="error-actions">
            <button class="btn-primary" onclick="location.reload()">再読み込み</button>
            <button class="btn-secondary" id="try-another-mode">別のモードで試す</button>
          </div>
        </div>
      `;

      document.getElementById('try-another-mode').addEventListener('click',()=>{
        switchProxyMode();
        loadUrl(url);
      });
    }

    function reload(){
      if(state.currentUrl){
        loadUrl(state.currentUrl);
      }
    }

    function goHome(){
      browserContent.innerHTML=welcomeHTML;
      state.currentUrl='';
      urlInput.value='';
    }

    function switchProxyMode(){
      const modes=Object.keys(PROXY_SERVICES);
      const currentIndex=modes.indexOf(state.mode);
      const nextIndex=(currentIndex+1)%modes.length;
      state.mode=modes[nextIndex];

      currentModeText.textContent=PROXY_SERVICES[state.mode].name;

      if(state.currentUrl){
        loadUrl(state.currentUrl);
      }
    }

    function toggleFullscreen(){
      proxyContainer.classList.toggle('is-fullscreen');

      if(proxyContainer.classList.contains('is-fullscreen')){
        fullscreenBtn.querySelector('.material-symbols-outlined').textContent='fullscreen_exit';
      }else{
        fullscreenBtn.querySelector('.material-symbols-outlined').textContent='fullscreen';
        proxyContainer.classList.remove('show-controls');
      }
    }

    function toggleControls(){
      if(!proxyContainer.classList.contains('is-fullscreen'))return;
      proxyContainer.classList.toggle('show-controls');
    }

    document.addEventListener('keydown',e=>{
      if(e.key==='ArrowUp'){
        toggleControls();
      }
      if(e.key==='Escape'&&proxyContainer.classList.contains('is-fullscreen')){
        toggleFullscreen();
      }
    });

    urlInput.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        loadUrl(urlInput.value);
      }
    });

    goBtn.addEventListener('click',()=>{
      loadUrl(urlInput.value);
    });

    reloadBtn.addEventListener('click',reload);
    homeBtn.addEventListener('click',goHome);
    fullscreenBtn.addEventListener('click',toggleFullscreen);
    proxyModeBtn.addEventListener('click',switchProxyMode);

    currentModeText.textContent=PROXY_SERVICES[state.mode].name;

    console.log('✓ Ultravioletプロキシ準備完了');
  </script>
  <script src="common/stealth-mode.js"></script>
  <script src="common/capture-handler.js"></script>
</body>
</html>
