<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Proxy | AppHub</title>
  <link rel="stylesheet" href="../common/common.css">
  <link rel="stylesheet" href="../css/proxy.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="icon" href="../assets/favicon1.svg">
  <link rel="apple-touch-icon" href="../assets/icon1.svg">
</head>
<body class="page-loading">
  <div class="app-container">
    <div class="main-container">
      <main class="main-content" style="padding:0;">
        <div class="proxy-container">
          <div class="browser-controls">
            <button class="control-btn" id="home-btn" title="ホーム">
              <span class="material-symbols-outlined">home</span>
            </button>
            
            <div class="url-bar">
              <span class="lock-icon material-symbols-outlined">lock</span>
              <input type="text" id="url-input" placeholder="URLを入力してください（例: https://example.com）" autocomplete="off">
              <button class="go-btn" id="go-btn">
                <span class="material-symbols-outlined">arrow_forward</span>
              </button>
            </div>
            
            <button class="control-btn" id="reload-btn" title="再読み込み">
              <span class="material-symbols-outlined">refresh</span>
            </button>
            
            <button class="control-btn" id="fullscreen-btn" title="全画面">
              <span class="material-symbols-outlined">fullscreen</span>
            </button>
          </div>
          
          <div class="browser-content" id="browser-content">
            <div class="welcome-screen">
              <div class="welcome-icon">
                <span class="material-symbols-outlined">public</span>
              </div>
              <h2>Ultraviolet プロキシブラウザ</h2>
              <p>高速プロキシ技術でWebサイトにアクセス</p>
              <div class="info-box">
                <h3>使い方</h3>
                <ol>
                  <li>上部のURLバーにアクセスしたいURLを入力</li>
                  <li>全画面ボタンで画面を最大化できます</li>
                </ol>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/sites.google.com/uv/uv.bundle.js"></script>
  <script src="/sites.google.com/uv/uv.config.js"></script>
  <script type="module">
    import{initPage}from'/sites.google.com/common/core.js';

    await initPage('proxy','プロキシブラウザ');

    const state={
      currentUrl:'',
      swReady:false
    };

    const urlInput=document.getElementById('url-input');
    const goBtn=document.getElementById('go-btn');
    const reloadBtn=document.getElementById('reload-btn');
    const homeBtn=document.getElementById('home-btn');
    const fullscreenBtn=document.getElementById('fullscreen-btn');
    const browserContent=document.getElementById('browser-content');
    const proxyContainer=document.querySelector('.proxy-container');

    const welcomeHTML=document.querySelector('.welcome-screen').outerHTML;

    async function registerSW(){
      if(!('serviceWorker'in navigator)){
        showError('','Service Worker非対応のブラウザです');
        return false;
      }

      try{
        console.log('SW登録開始...');
        console.log('SW path:','/sites.google.com/uv/uv.sw.js');
        console.log('SW scope:','/sites.google.com/uv/');
        
        const registration=await navigator.serviceWorker.register('/sites.google.com/uv/uv.sw.js',{
          scope:'/sites.google.com/uv/service/'});

        console.log('SW登録成功:',registration);
        console.log('SW scope:',registration.scope);

        await navigator.serviceWorker.ready;
        console.log('SW ready');

        if(registration.active){
          state.swReady=true;
          console.log('✓ Service Worker active');
          return true;
        }

        console.log('SW installing, reload required');
        window.location.reload();
        return false;
      }catch(e){
        console.error('✗ SW registration failed:',e);
        console.error('Error name:',e.name);
        console.error('Error message:',e.message);
        showError('',`Service Workerの登録に失敗しました: ${e.message}`);
        return false;
      }
    }

    async function loadUrl(url){
      if(!url)return;
      if(!url.startsWith('http'))url='https://'+url;

      if(!state.swReady){
        showLoading();
        const ready=await registerSW();
        if(!ready)return;
      }

      state.currentUrl=url;
      urlInput.value=url;
      showLoading();

      try{
        const encoded=__uv$config.encodeUrl(url);
        const proxyUrl=location.origin+__uv$config.prefix+encoded;

        console.log('Original URL:',url);
        console.log('Encoded:',encoded);
        console.log('Proxy URL:',proxyUrl);

        const iframe=document.createElement('iframe');
        iframe.className='proxy-iframe';
        iframe.src=proxyUrl;
        iframe.allow='fullscreen';

        browserContent.innerHTML='';
        browserContent.appendChild(iframe);
      }catch(e){
        console.error('読み込みエラー:',e);
        showError(url,e.message);
      }
    }

    function showLoading(){
      browserContent.innerHTML=`
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <p>読み込み中...</p>
        </div>
      `;
    }

    function showError(url,message){
      browserContent.innerHTML=`
        <div class="error-screen">
          <div class="error-icon">
            <span class="material-symbols-outlined">error</span>
          </div>
          <h2>読み込みに失敗しました</h2>
          <p>${message}</p>
          ${url?`<p style="font-size:14px;color:var(--text-tertiary);margin-bottom:24px;">URL: ${url}</p>`:''}
          <div class="error-actions">
            <button class="btn-primary" onclick="location.reload()">ページを再読み込み</button>
            <button class="btn-secondary" id="check-sw-btn">SW状態確認</button>
          </div>
        </div>
      `;

      const checkBtn=document.getElementById('check-sw-btn');
      if(checkBtn){
        checkBtn.addEventListener('click',async()=>{
          const registrations=await navigator.serviceWorker.getRegistrations();
          console.log('登録済みSW:',registrations);
          alert('コンソールを確認してください（利用不可の場合は管理者に連絡）');
        });
      }
    }

    function reload(){
      if(state.currentUrl){
        loadUrl(state.currentUrl);
      }
    }

    function goHome(){
      browserContent.innerHTML=welcomeHTML;
      state.currentUrl='';
      urlInput.value='';
    }

    function toggleFullscreen(){
      proxyContainer.classList.toggle('is-fullscreen');
      const icon=fullscreenBtn.querySelector('.material-symbols-outlined');
      icon.textContent=proxyContainer.classList.contains('is-fullscreen')?'fullscreen_exit':'fullscreen';
    }

    urlInput.addEventListener('keydown',e=>{
      if(e.key==='Enter')loadUrl(urlInput.value);
    });

    goBtn.addEventListener('click',()=>loadUrl(urlInput.value));
    reloadBtn.addEventListener('click',reload);
    homeBtn.addEventListener('click',goHome);
    fullscreenBtn.addEventListener('click',toggleFullscreen);

    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&proxyContainer.classList.contains('is-fullscreen')){
        toggleFullscreen();
      }
    });

    registerSW();
    console.log('✓ Ultraviolet初期化完了');
  </script>
  <script src="../common/stealth-mode.js"></script>
  <script src="../common/capture-handler.js"></script>
</body>
</html>
